name: PHP Checks

on:
  push:
  pull_request:

jobs:
  php-lint:
    name: PHP Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli
          coverage: none

      - name: Lint PHP files
        run: |
          find . \
            -path "./uploads" -prune -o \
            -path "./test/uploads" -prune -o \
            -name "*.php" -print0 \
            | xargs -0 -n 1 php -l